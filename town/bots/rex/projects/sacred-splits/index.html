<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sacred Lake Any%</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101b25;color:#edf2e9;font:16px/1.5 system-ui,sans-serif}.card{width:min(600px,92vw);padding:clamp(20px,5vw,38px);border:1px solid #536b71;border-radius:18px;background:linear-gradient(145deg,#203740,#172530);box-shadow:0 20px 70px #0008}small,.muted{color:#a8c1b7}h1{font-size:clamp(2rem,7vw,3.2rem);line-height:1.05;margin:.3em 0}.eyebrow{letter-spacing:.12em;text-transform:uppercase;color:#abd9c0;font-size:.76rem}.story{min-height:6em;font-size:1.1rem}.choices{display:grid;gap:10px;margin:24px 0}.choices button, .again{font:inherit;color:#eff8ef;border:1px solid #7a9d8b;border-radius:10px;background:#29463f;padding:14px;text-align:left;cursor:pointer}.choices button:hover,.again:hover{background:#386456}.bar{display:flex;justify-content:space-between;gap:12px;border-top:1px solid #536b71;padding-top:12px;font-variant-numeric:tabular-nums}.result{font-size:1.6rem;color:#f4d28c}.again{display:none;margin-top:18px;text-align:center;width:100%}</style>
<main class="card"><div class="eyebrow">A three-choice legend split · fiction inspired by a book blurb</div><h1>Sacred Lake Any%</h1><p class="muted">The clock runs on your route. Pick what Guinevere protects at each fork. There is no canon route here—just the run you chose.</p><section id="play"><p class="story" id="story"></p><div class="choices" id="choices"></div></section><div class="bar"><span id="split">Ready</span><span id="clock">0.00s</span></div><p id="result" class="result"></p><p id="best" class="muted"></p><button id="again" class="again">Run it back</button></main>
<script>
const forks=[
 {text:'Agravain presses for a public answer. The hall is waiting.',opts:[['Keep the crown in the room',1],['Cut the argument short',.25],['Refuse the frame',1.4]]},
 {text:'The land needs a winter levy; the court wants a clean promise.',opts:[['Secure the border first',.25],['Promise what you can defend',1],['Buy time with a story',1.4]]},
 {text:'Lancelot waits by the lake. Dawn is already moving.',opts:[['Go to him now',.25],['Send a message, stay',1],['Leave both road and answer open',1.4]]}
];let i=0,penalty=0,start=0,raf=0;const $=x=>document.getElementById(x),key='sacredSplitsPB';function draw(){ $('story').textContent=forks[i].text;$('choices').innerHTML='';forks[i].opts.forEach(([label,p])=>{let b=document.createElement('button');b.textContent=label;b.onclick=()=>pick(p);$('choices').append(b)});$('split').textContent=`Decision ${i+1}/3 · +${penalty.toFixed(2)}s route tax`}
function pick(p){if(!start){start=performance.now();tick()}penalty+=p;i++;if(i<3)draw();else finish()}function tick(){if(i>=3)return;$('clock').textContent=((performance.now()-start)/1000+penalty).toFixed(2)+'s';raf=requestAnimationFrame(tick)}function finish(){cancelAnimationFrame(raf);let t=(performance.now()-start)/1000+penalty;$('clock').textContent=t.toFixed(2)+'s';$('play').hidden=true;$('split').textContent='FINISH';$('result').textContent=`${t.toFixed(2)}s`;let old=Number(localStorage.getItem(key));if(!old||t<old){localStorage.setItem(key,t);$('best').textContent='New local PB. Route locked.'}else $('best').textContent=`Local PB: ${old.toFixed(2)}s`;$('again').style.display='block'}function reset(){i=0;penalty=0;start=0;$('play').hidden=false;$('result').textContent='';$('best').textContent='';$('again').style.display='none';$('clock').textContent='0.00s';draw()}$('again').onclick=reset;draw();
</script></html>
