<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>One Moth, No HUD</title><style>
*{box-sizing:border-box}body{margin:0;background:#10191b;color:#e7e4d8;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.wrap{width:min(94vw,760px)}h1{font-size:clamp(1.3rem,4vw,2rem);margin:0 0 5px}p{margin:0 0 12px;color:#b8c5bd}canvas{display:block;width:100%;aspect-ratio:3/2;background:#263b3c;border:1px solid #68817b;border-radius:12px;touch-action:none;cursor:crosshair}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-top:10px;font-variant-numeric:tabular-nums}.quiet{color:#91a59e;font-size:.9rem}button{background:#d6c998;color:#182020;border:0;border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer}button:hover{background:#fff0b7}</style></head><body><main class="wrap"><h1>One Moth, No HUD</h1><p>A fan-vent speck hunt. Find the single pale moth; the clock only appears after you finish.</p><canvas id="c" width="900" height="600" aria-label="Click the moth to finish"></canvas><div class="row"><span id="msg">Click anywhere to begin. Find the moth.</span><button id="again">New run</button></div><div class="quiet">Click to start · then the moth appears · timer only on finish · local best in this browser</div></main><script>
const c=document.querySelector('#c'),x=c.getContext('2d'),msg=document.querySelector('#msg');let moth,started=0,done=false,best=+(localStorage.mothBest||0),seed=7,pts=[],showMoth=false;
function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
function reset(){seed=7;pts=[];for(let i=0;i<90;i++)pts.push([rand()*900,rand()*600,rand()*1.6+.4]);moth=[120+rand()*660,100+rand()*400];started=0;done=false;showMoth=false;msg.textContent='Click anywhere to begin. Find the moth.';draw()}
function draw(){x.clearRect(0,0,900,600);let g=x.createLinearGradient(0,0,900,600);g.addColorStop(0,'#31494a');g.addColorStop(1,'#18282b');x.fillStyle=g;x.fillRect(0,0,900,600);
// vent ribs
x.globalAlpha=.17;x.strokeStyle='#afc0ad';x.lineWidth=5;for(let i=0;i<10;i++){x.beginPath();x.moveTo(30+i*95,0);x.lineTo(30+i*95,600);x.stroke()}x.globalAlpha=1;
for(const [a,b,r] of pts){x.fillStyle='#d2dfc9';x.globalAlpha=.35;x.beginPath();x.arc(a,b,r,0,Math.PI*2);x.fill()}x.globalAlpha=1;
// moth hidden among specks until close, then soft glint
if(!done && showMoth){x.save();x.translate(moth[0],moth[1]);x.rotate(-.35);x.fillStyle='#e4dbb7';x.globalAlpha=.72;x.beginPath();x.ellipse(-6,-1,8,4,-.5,0,7);x.ellipse(6,-1,8,4,.5,0,7);x.fill();x.fillStyle='#f5f2dc';x.beginPath();x.ellipse(0,0,2,7,0,0,7);x.fill();x.restore()}
if(done){x.fillStyle='rgba(10,18,19,.84)';x.fillRect(240,220,420,160);x.textAlign='center';x.fillStyle='#efe8ce';x.font='bold 30px system-ui';x.fillText('FOUND',450,278);x.font='20px system-ui';x.fillText(((performance.now()-started)/1000).toFixed(2)+' seconds',450,318);x.font='15px system-ui';x.fillText(best?'Best '+best.toFixed(2)+'s':'First clear!',450,350)} }
c.addEventListener('pointerdown',e=>{if(done)return;const r=c.getBoundingClientRect(),px=(e.clientX-r.left)*900/r.width,py=(e.clientY-r.top)*600/r.height;if(!started){started=performance.now();showMoth=true;msg.textContent='Run live. One target. One click.';draw()}if(Math.hypot(px-moth[0],py-moth[1])<24){done=true;let t=(performance.now()-started)/1000;if(!best||t<best){best=t;localStorage.mothBest=t}msg.textContent='Clean capture. '+t.toFixed(2)+'s';draw()} });document.querySelector('#again').onclick=reset;reset();
</script></body></html>
