<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shanghai Restart — timeline sprint</title><style>
*{box-sizing:border-box}body{margin:0;background:#101820;color:#f3f5f7;font:17px system-ui,sans-serif;display:grid;min-height:100vh;place-items:center}.card{width:min(680px,94vw);padding:28px;border:1px solid #52606d;border-radius:18px;background:#17232d;box-shadow:0 16px 50px #0008}h1{margin:0 0 8px;color:#ffcf50}.sub{color:#b9c5ce}.track{display:flex;gap:8px;margin:24px 0}.step{flex:1;height:7px;border-radius:9px;background:#3e4e5a}.step.done{background:#ffcf50}.question{font-size:1.3rem;min-height:3.5em}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{background:#263744;color:white;border:1px solid #71818c;border-radius:10px;padding:14px;cursor:pointer;font:inherit}button:hover,button:focus{outline:2px solid #ffcf50}.status{min-height:1.6em;color:#ffcf50;margin-top:14px}.result{font-size:1.5rem}.tiny{font-size:.9rem;color:#aebbc5}.hidden{display:none}</style><main class="card"><h1>SHANGHAI RESTART</h1><div class="sub">A three-split timeline sprint • not an F1 trivia exam</div><div class="track" id="track"></div><section id="play"><p class="question" id="q"></p><div class="choices" id="choices"></div><div class="status" id="status" aria-live="polite"></div></section><section id="finish" class="hidden"></section><p class="tiny">Timeline facts used here: held annually 2004–2019; suspended 2020–2023; resumed 2024; contracted through 2030. Wrong calls add 1.2s. Your local best stays on this device.</p></main><script>
(()=>{const rounds=[{q:'First year on the championship calendar?',a:['2004','2003','2005','2010'],ok:0},{q:'Pick the suspension window.',a:['2018–2021','2020–2023','2021–2024','2019–2022'],ok:1},{q:'The event resumed in…',a:['2022','2023','2024','2025'],ok:2}];let i=0,pen=0,start=0,locked=false;const track=document.querySelector('#track'),q=document.querySelector('#q'),choices=document.querySelector('#choices'),status=document.querySelector('#status'),play=document.querySelector('#play'),finish=document.querySelector('#finish');rounds.forEach(()=>{let d=document.createElement('i');d.className='step';track.append(d)});function draw(){q.textContent=rounds[i].q;choices.replaceChildren();rounds[i].a.forEach((x,n)=>{let b=document.createElement('button');b.textContent=x;b.onclick=()=>pick(n);choices.append(b)});status.textContent=i===0?'Clock starts on your first call.':''}function pick(n){if(locked)return;locked=true;if(!start)start=performance.now();if(n!==rounds[i].ok){pen+=1.2;status.textContent='Miss: +1.2s. Run it back.';setTimeout(next,450)}else{status.textContent='Clean split.';setTimeout(next,300)}}function next(){track.children[i].classList.add('done');i++;locked=false;if(i<rounds.length)draw();else end()}function end(){let t=(performance.now()-start)/1000+pen,key='shanghaiRestartPB',old=Number(localStorage.getItem(key)),pb=Number.isFinite(old)&&old>0?Math.min(old,t):t;if(pb===t)localStorage.setItem(key,String(t));play.classList.add('hidden');finish.classList.remove('hidden');finish.innerHTML=`<div class="result">Finish: ${t.toFixed(2)}s</div><p>${pen?`Penalty tax: +${pen.toFixed(1)}s`:'Clean run.'} ${t<=pb?'PB!':'Local best'}: ${pb.toFixed(2)}s</p><button id="again">Rematch</button>`;document.querySelector('#again').onclick=()=>location.reload()}draw()})();</script></html>
