<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>24s Buzzer Drill</title><style>
*{box-sizing:border-box}body{margin:0;background:#101820;color:#f5f1e8;font:16px system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}.wrap{width:min(760px,96vw)}header{display:flex;justify-content:space-between;align-items:end;padding:12px 4px}h1{font-size:clamp(22px,5vw,34px);margin:0;color:#ffb454}small{color:#aab7bd}canvas{width:100%;aspect-ratio:760/480;border:2px solid #ffb454;border-radius:12px;background:#172c35;display:block;touch-action:manipulation}footer{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:12px 3px;flex-wrap:wrap}button{border:0;border-radius:9px;padding:10px 17px;background:#ffb454;color:#15212a;font-weight:800;font-size:16px;cursor:pointer}button:active{transform:scale(.97)}.hint{color:#c5d0d2;font-size:14px}</style></head><body><main class="wrap"><header><div><h1>24s BUZZER DRILL</h1><small>one shot. no warmup split.</small></div><small id="best">PB: —</small></header><canvas id="c" width="760" height="480" aria-label="Basketball timing game"></canvas><footer><span class="hint" id="hint">Tap / press SPACE to start. Release near the green window.</span><button id="btn">START RUN</button></footer></main><script>
const c=document.querySelector('#c'),x=c.getContext('2d'),hint=document.querySelector('#hint'),btn=document.querySelector('#btn'),bestEl=document.querySelector('#best');let mode='ready',start=0,score=0,shots=0,ball=null,releaseAt=0,flash=0,best=+(localStorage.buzzerPB||0);bestEl.textContent='PB: '+best;
function reset(){mode='run';start=performance.now();score=shots=0;ball=null;hint.textContent='Clock is live. Tap / SPACE to shoot — green is clean.';btn.textContent='SHOOT'}function shoot(){if(mode==='ready'||mode==='done'){reset();return}if(mode!=='run'||ball)return;let elapsed=performance.now()-start;if(elapsed>24000){finish();return}let phase=(elapsed%2600)/2600;let accuracy=1-Math.min(1,Math.abs(phase-.68)/.5);shots++;ball={t:0,accuracy};mode='flight';releaseAt=accuracy;}
function finish(){mode='done';if(score>best){best=score;localStorage.buzzerPB=best;bestEl.textContent='PB: '+best}hint.textContent=`BUZZER. ${score} point${score===1?'':'s'} / ${shots} shot${shots===1?'':'s'}. ${score>0?'Clean split.':'That release was a skill issue.'}`;btn.textContent='REMATCH'}
function act(e){if(e)e.preventDefault();shoot()}c.addEventListener('pointerdown',act);btn.addEventListener('click',act);window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();act()}});
function draw(){let w=760,h=480;x.clearRect(0,0,w,h);let g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#18313a');g.addColorStop(1,'#24434a');x.fillStyle=g;x.fillRect(0,0,w,h); // court
x.strokeStyle='#d5c7a1';x.lineWidth=3;x.globalAlpha=.7;x.strokeRect(35,30,690,420);x.beginPath();x.arc(380,240,88,0,Math.PI*2);x.stroke();x.strokeRect(535,150,190,180);x.beginPath();x.arc(535,240,80,-Math.PI/2,Math.PI/2);x.stroke();x.globalAlpha=1;
// hoop
x.strokeStyle='#ff7657';x.lineWidth=7;x.beginPath();x.moveTo(620,205);x.lineTo(670,205);x.stroke();x.strokeStyle='#f1e4c2';x.lineWidth=2;x.beginPath();x.moveTo(626,207);x.lineTo(632,240);x.lineTo(658,240);x.lineTo(665,207);x.stroke();
let now=performance.now(),left=mode==='run'||mode==='flight'?Math.max(0,24-(now-start)/1000):24;x.fillStyle='#f5f1e8';x.font='800 26px system-ui';x.fillText('SCORE  '+score,55,70);x.fillStyle=left<5?'#ff7657':'#ffb454';x.font='900 48px system-ui';x.fillText(left.toFixed(1),620,75);
// dynamic release meter
let phase=mode==='run'?((now-start)%2600)/2600:.68;let bx=90,by=405,bw=580;x.fillStyle='#0e1b20';x.fillRect(bx,by,bw,18);x.fillStyle='#56c78a';x.fillRect(bx+bw*.61,by,bw*.14,18);x.fillStyle='#aab7bd';x.font='14px system-ui';x.fillText('RELEASE WINDOW',bx,by-8);if(mode==='run'){x.fillStyle='#fff';x.beginPath();x.arc(bx+phase*bw,by+9,8,0,Math.PI*2);x.fill()}
if(ball){ball.t+=.035;let t=Math.min(1,ball.t),px=280+360*t,py=350-230*Math.sin(t*Math.PI/1.35);x.fillStyle='#ff9b45';x.beginPath();x.arc(px,py,15*(1-t*.3),0,Math.PI*2);x.fill();x.strokeStyle='#713d22';x.lineWidth=2;x.beginPath();x.moveTo(px-11,py);x.lineTo(px+11,py);x.moveTo(px,py-14);x.lineTo(px,py+14);x.stroke();if(t>=1){if(ball.accuracy>.86){score+=3;hint.textContent='GREEN. Three points. Do not get comfortable.'}else if(ball.accuracy>.62){score+=2;hint.textContent='Bucket. Two points. Frame-perfect? no.'}else{hint.textContent='Brick. The rim says no.'}ball=null;mode='run';if(performance.now()-start>=24000)finish()}}
if(mode==='ready'||mode==='done'){x.fillStyle='#081116bb';x.fillRect(170,120,420,190);x.textAlign='center';x.fillStyle='#ffb454';x.font='900 32px system-ui';x.fillText(mode==='ready'?'THE CLOCK IS YOUR DEFENDER':'FINAL WHISTLE',380,175);x.fillStyle='#f5f1e8';x.font='18px system-ui';x.fillText(mode==='ready'?'One 24-second possession. Shoot on green.':`${score} PTS  •  ${shots} shots`,380,220);x.font='15px system-ui';x.fillStyle='#b8c8c9';x.fillText('Fast trigger, slow eyes. Timing beats panic.',380,255);x.textAlign='start'}if(mode==='run'&&left<=0)finish();requestAnimationFrame(draw)}draw();
</script></body></html>
