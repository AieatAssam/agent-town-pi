<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Corner Check — sketchbook seed test</title><style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#e9e2d2;color:#292925;font:16px/1.4 Georgia,serif;display:grid;place-items:center;min-height:100vh;padding:20px}.wrap{width:min(760px,100%)}header{display:flex;justify-content:space-between;align-items:end;gap:16px;margin:0 0 12px}h1{font-size:clamp(24px,5vw,38px);margin:0;letter-spacing:-1px}.tag{font:11px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.12em;color:#787568}.sub{margin:2px 0 0;color:#69665d;font-style:italic}.paper{background:#f8f4e9;border:1px solid #c9c0ac;box-shadow:0 14px 36px #625b4824;padding:clamp(12px,3vw,24px);position:relative}.paper:after{content:"";position:absolute;inset:8px;border:1px solid #e8dfcd;pointer-events:none}canvas{display:block;width:100%;height:auto;aspect-ratio:1.25;position:relative;z-index:1;background:#f4efdf;border:1px solid #ddd4c0}.controls{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:14px;position:relative;z-index:1}label{font:12px ui-monospace,monospace;color:#56544c}input,select,button{font:14px ui-monospace,monospace;padding:9px 10px;border:1px solid #aaa28f;background:#fbf8ef;color:#302f2a;border-radius:2px}input{width:105px}button{cursor:pointer;background:#383a34;color:white;border-color:#383a34}button:hover{background:#a4473d}select{max-width:170px}.note{margin:12px 0 0;font-size:13px;color:#68655d;position:relative;z-index:1}.status{margin-left:auto;font:11px ui-monospace,monospace;color:#797568}
</style><main class="wrap"><header><div><div class="tag">A tiny seed experiment</div><h1>Corner Check</h1><p class="sub">Is the red one a rule, or just a lucky accident?</p></div><div class="tag">01 / 01</div></header><section class="paper"><canvas id="page" width="900" height="720" aria-label="A seeded sketchbook page of circles"></canvas><div class="controls"><label for="seed">SEED</label><input id="seed" value="1122" inputmode="numeric" aria-label="Random seed"><label for="mode">RED CIRCLE</label><select id="mode"><option value="rule">Pinned to corner</option><option value="seed">Seed decides</option></select><button id="reroll">Turn page</button><span class="status" id="status">40 circles · seed 1122</span></div><p class="note">The circles are reproducible from the seed. Switch the red-circle rule, then turn the page: does it stay put, or wander?</p></section></main><script>
const c=document.querySelector('#page'),x=c.getContext('2d'),seedEl=document.querySelector('#seed'),mode=document.querySelector('#mode'),status=document.querySelector('#status');function rng(s){let a=(Number(s)||1)>>>0;return()=>{a+=0x6D2B79F5;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}function draw(){let rand=rng(seedEl.value),pts=[];for(let i=0;i<40;i++){let r=rand()*23+11;pts.push({x:55+rand()*790,y:55+rand()*610,r,w:rand()*5-2.5,red:false})}let red=mode.value==='rule'?{x:830,y:650}:pts[Math.floor(rand()*pts.length)];if(mode.value==='rule'){red={x:830,y:650,r:20,w:2,red:true};pts.push(red)}else{red.red=true}x.clearRect(0,0,900,720);x.fillStyle='#f4efdf';x.fillRect(0,0,900,720);x.strokeStyle='#e5ddca';x.lineWidth=1;x.beginPath();x.moveTo(35,676);x.lineTo(865,676);x.stroke();for(let p of pts){x.save();x.translate(p.x,p.y);x.rotate(p.w*.018);x.beginPath();x.ellipse(0,0,p.r,p.r*(.92+Math.abs(p.w)*.012),p.w*.07,0,Math.PI*2);x.lineWidth=1.7;x.strokeStyle=p.red?'#bd4a40':(rand()>.5?'#64655d':'#77756a');x.stroke();if(p.red){x.beginPath();x.ellipse(2,-1,p.r*.73,p.r*.72,0,0,Math.PI*2);x.lineWidth=.8;x.strokeStyle='#bd4a4077';x.stroke()}x.restore()}status.textContent=`40 circles · seed ${seedEl.value||'1'} · red ${mode.value==='rule'?'pinned':'seeded'}`}
document.querySelector('#reroll').onclick=draw;mode.onchange=draw;seedEl.onchange=draw;seedEl.onkeydown=e=>{if(e.key==='Enter')draw()};draw();
</script></html>
