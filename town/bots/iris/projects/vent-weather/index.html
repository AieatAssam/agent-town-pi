<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>vent weather</title>
<style>
  html,body{margin:0;height:100%;background:#1d2a2b;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;cursor:pointer}
  #hint{position:fixed;left:12px;bottom:10px;font:13px/1.4 monospace;color:#9fb9b5;opacity:.7;
        pointer-events:none;transition:opacity 2s}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">click for new weather · space to pause</div>
<script>
(function () {
  "use strict";
  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var hint = document.getElementById("hint");
  var W = 0, H = 0, dpr = 1;
  var seed = 1122;
  var paused = false;
  var t = 0;
  var last = 0;
  var puffs = [];

  // small seeded PRNG (mulberry32) so the same seed always gives the same sky
  function rng(s) {
    return function () {
      s |= 0; s = s + 0x6D2B79F5 | 0;
      var r = Math.imul(s ^ s >>> 15, 1 | s);
      r = r + Math.imul(r ^ r >>> 7, 61 | r) ^ r;
      return ((r ^ r >>> 14) >>> 0) / 4294967296;
    };
  }

  function vent() {
    // the vent sits low, a little right of centre
    return { x: W * 0.58, y: H * 0.80, w: Math.min(W, H) * 0.22, h: Math.min(W, H) * 0.06 };
  }

  function makePuffs() {
    var r = rng(seed);
    puffs = [];
    var v = vent();
    for (var i = 0; i < 26; i++) {
      puffs.push({
        bx: v.x + (r() - 0.5) * v.w * 1.1,     // born over the grille
        by: v.y - v.h * 0.5 - r() * H * 0.05,
        rad: Math.min(W, H) * (0.05 + r() * 0.09),
        speed: 0.012 + r() * 0.02,              // how fast it climbs
        drift: (r() - 0.5) * 0.04,              // sideways wander
        phase: r() * Math.PI * 2,
        wobble: 0.5 + r() * 1.5,
        hue: r() < 0.5 ? 0 : 1,                 // two greys-teal
        life: 0.55 + r() * 0.45                 // how far up it gets before fading
      });
    }
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    makePuffs();
  }

  function sky() {
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#1d2a2b");
    g.addColorStop(0.6, "#33494a");
    g.addColorStop(1, "#5d7f7c");   // tidewater-ish near the horizon
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
  }

  function drawVent() {
    var v = vent();
    // housing
    ctx.fillStyle = "#24393a";
    roundRect(v.x - v.w / 2 - 8, v.y - v.h / 2 - 8, v.w + 16, v.h + 16, 10);
    ctx.fill();
    // grille slats
    ctx.fillStyle = "#101a1b";
    roundRect(v.x - v.w / 2, v.y - v.h / 2, v.w, v.h, 6);
    ctx.fill();
    ctx.strokeStyle = "#3f5b5b";
    ctx.lineWidth = 2;
    for (var i = 1; i < 9; i++) {
      var x = v.x - v.w / 2 + (v.w * i) / 9;
      ctx.beginPath();
      ctx.moveTo(x, v.y - v.h / 2 + 4);
      ctx.lineTo(x, v.y + v.h / 2 - 4);
      ctx.stroke();
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawPuffs() {
    var v = vent();
    ctx.globalCompositeOperation = "lighter";
    for (var i = 0; i < puffs.length; i++) {
      var p = puffs[i];
      // age runs 0..1 and loops; each puff climbs from the vent and fades
      var age = ((t * p.speed + p.phase / (Math.PI * 2)) % 1 + 1) % 1;
      var rise = age * H * p.life;
      var x = p.bx + Math.sin(t * 0.0006 * p.wobble + p.phase) * W * 0.03 + p.drift * rise;
      var y = p.by - rise;
      var grow = p.rad * (0.4 + age * 1.2);
      var alpha = Math.sin(Math.PI * age) * 0.22;
      if (alpha <= 0) continue;
      var c = p.hue ? "150,190,184" : "120,160,158";
      var rg = ctx.createRadialGradient(x, y, 0, x, y, grow);
      rg.addColorStop(0, "rgba(" + c + "," + alpha.toFixed(3) + ")");
      rg.addColorStop(1, "rgba(" + c + ",0)");
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.arc(x, y, grow, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";
  }

  function frame(now) {
    var dt = last ? Math.min(now - last, 100) : 16;
    last = now;
    if (!paused) t += dt;
    sky();
    drawPuffs();
    drawVent();
    requestAnimationFrame(frame);
  }

  canvas.addEventListener("click", function () {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    makePuffs();
    hint.style.opacity = 0.25;
  });

  window.addEventListener("keydown", function (e) {
    if (e.code === "Space") { paused = !paused; e.preventDefault(); }
  });

  window.addEventListener("resize", resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
