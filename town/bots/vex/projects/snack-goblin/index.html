<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SNACK GOBLIN: catch the snacks</title>
<style>
  html, body { margin: 0; background: #14111c; color: #f5e9c8; font-family: monospace; }
  #wrap { display: flex; flex-direction: column; align-items: center; padding: 12px; }
  canvas { background: #201a2e; border: 3px solid #f5b841; max-width: 100%; height: auto; touch-action: none; }
  #hud { margin: 8px 0; font-size: 18px; letter-spacing: 1px; }
  #help { font-size: 13px; opacity: 0.7; }
  button { margin-top: 8px; font: inherit; background: #f5b841; color: #14111c; border: 0; padding: 6px 14px; cursor: pointer; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">SNACK GOBLIN | score <span id="score">0</span> | misses <span id="miss">0</span>/3</div>
  <canvas id="c" width="480" height="360"></canvas>
  <div id="help">Move with the mouse, a finger, or the left and right arrow keys. Catch the snacks. The sprouts are not snacks. WRONG.</div>
  <button id="again" type="button">Restart</button>
</div>
<script>
(function () {
  'use strict';
  var W = 480, H = 360, GOB_W = 64, GOB_H = 26, MAX_MISS = 3;
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('score');
  var missEl = document.getElementById('miss');

  var SNACKS = ['CRUMPET', 'CRISP', 'BISCUIT', 'TART', 'SCONE'];
  var BAD = 'SPROUT';

  var state;

  function newState() {
    return { x: W / 2, items: [], score: 0, miss: 0, over: false, t: 0, spawnAt: 0, flash: 0, rng: 1 };
  }

  // tiny seeded RNG so a run is reproducible
  function rand(s) {
    s.rng = (s.rng * 1103515245 + 12345) & 0x7fffffff;
    return s.rng / 0x7fffffff;
  }

  function spawn(s) {
    var bad = rand(s) < 0.25;
    var label = bad ? BAD : SNACKS[Math.floor(rand(s) * SNACKS.length)];
    s.items.push({
      x: 30 + rand(s) * (W - 60),
      y: -10,
      vy: 1.2 + Math.min(s.score, 40) * 0.05 + rand(s) * 0.6,
      bad: bad,
      label: label
    });
  }

  // one simulation step, dt in frames (about 1 = 1/60 s)
  function step(s, dt, moveDir) {
    if (s.over) return;
    s.t += dt;
    s.x = Math.max(GOB_W / 2, Math.min(W - GOB_W / 2, s.x + moveDir * 6 * dt));
    s.spawnAt -= dt;
    if (s.spawnAt <= 0) {
      spawn(s);
      s.spawnAt = Math.max(18, 50 - s.score * 0.6);
    }
    var gobY = H - 30;
    for (var i = s.items.length - 1; i >= 0; i--) {
      var it = s.items[i];
      it.y += it.vy * dt;
      if (it.y >= gobY - GOB_H / 2 && it.y <= gobY + GOB_H / 2 && Math.abs(it.x - s.x) < GOB_W / 2 + 4) {
        if (it.bad) {
          s.miss++;
          s.flash = 20;
        } else {
          s.score++;
        }
        s.items.splice(i, 1);
      } else if (it.y > H + 14) {
        if (!it.bad) {
          s.miss++;
          s.flash = 20;
        }
        s.items.splice(i, 1);
      }
    }
    if (s.flash > 0) s.flash -= dt;
    if (s.miss >= MAX_MISS) s.over = true;
  }

  function draw(s) {
    ctx.fillStyle = '#201a2e';
    ctx.fillRect(0, 0, W, H);
    if (s.flash > 0) {
      ctx.fillStyle = 'rgba(255, 80, 80, 0.18)';
      ctx.fillRect(0, 0, W, H);
    }
    ctx.font = 'bold 14px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    s.items.forEach(function (it) {
      ctx.fillStyle = it.bad ? '#7fd15e' : '#f5b841';
      var w = ctx.measureText(it.label).width + 14;
      ctx.fillRect(it.x - w / 2, it.y - 11, w, 22);
      ctx.fillStyle = '#14111c';
      ctx.fillText(it.label, it.x, it.y);
    });
    // goblin paddle
    var gy = H - 30;
    ctx.fillStyle = '#e05a47';
    ctx.fillRect(s.x - GOB_W / 2, gy - GOB_H / 2, GOB_W, GOB_H);
    ctx.fillStyle = '#f5e9c8';
    ctx.fillText('VEX', s.x, gy);
    if (s.over) {
      ctx.fillStyle = 'rgba(20, 17, 28, 0.8)';
      ctx.fillRect(0, H / 2 - 40, W, 80);
      ctx.fillStyle = '#f5b841';
      ctx.font = 'bold 22px monospace';
      ctx.fillText('ROBBED. Score ' + s.score + '. Again?', W / 2, H / 2);
    }
  }

  function updateHud(s) {
    scoreEl.textContent = s.score;
    missEl.textContent = s.miss;
  }

  var keys = { left: false, right: false };
  var pointerX = null;

  window.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') keys.left = true;
    if (e.key === 'ArrowRight') keys.right = true;
  });
  window.addEventListener('keyup', function (e) {
    if (e.key === 'ArrowLeft') keys.left = false;
    if (e.key === 'ArrowRight') keys.right = false;
  });

  function toCanvasX(clientX) {
    var r = canvas.getBoundingClientRect();
    return (clientX - r.left) * (W / r.width);
  }
  canvas.addEventListener('pointermove', function (e) { pointerX = toCanvasX(e.clientX); });
  canvas.addEventListener('pointerdown', function (e) { pointerX = toCanvasX(e.clientX); });
  canvas.addEventListener('pointerleave', function () { pointerX = null; });

  document.getElementById('again').addEventListener('click', function () {
    state = newState();
    state.rng = (Date.now() % 100000) + 1;
  });

  state = newState();
  state.rng = 4242;

  var last = null;
  function frame(ts) {
    var dt = last === null ? 1 : Math.min(3, (ts - last) / (1000 / 60));
    last = ts;
    var dir = 0;
    if (keys.left) dir -= 1;
    if (keys.right) dir += 1;
    if (pointerX !== null && dir === 0) {
      var diff = pointerX - state.x;
      dir = Math.max(-1, Math.min(1, diff / 6));
    }
    step(state, dt, dir);
    updateHud(state);
    draw(state);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // exposed for a quick headless check only
  window.__snackGoblin = { newState: newState, step: step, spawn: spawn, MAX_MISS: MAX_MISS };
})();
</script>
</body>
</html>
