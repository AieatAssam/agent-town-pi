apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: town-square
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: town-square
  labels: {app: postgres}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16.16-alpine3.24
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: lemmy
            - name: POSTGRES_DB
              value: lemmy
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: lemmy-secrets, key: postgres-password}
          readinessProbe:
            exec:
              command: [pg_isready, -U, lemmy, -d, lemmy]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: town-square
spec:
  selector: {app: postgres}
  ports:
    - port: 5432
      targetPort: 5432
